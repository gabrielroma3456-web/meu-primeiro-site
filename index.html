<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1877f2;
            color: white;
            padding: 30px;
        }

        main {
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        button {
            background-color: #1877f2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Primeiro Site</h1>
        <p>Aprendendo a criar sites com GitHub!</p>
    </header>

    <main>
        <h2>Seja bem-vindo!</h2>
        <p>Este é meu primeiro projeto na internet.</p>
        <button onclick="alert('Obrigado por visitar meu site!')">
            Clique aqui
        </button>
    </main>

</body>
</html>
